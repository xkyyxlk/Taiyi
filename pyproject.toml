[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "taiyi-ai"
version = "0.1.0"
description = "One Identity, Many Incarnations — a version control system for persistent AI identity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Taiyi Contributors" }]
keywords = ["ai", "identity", "memory", "event-sourcing", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
taiyi = "taiyi.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyi"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # Typer command declarations intentionally use Option/Argument defaults.

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
packages = ["taiyi"]
