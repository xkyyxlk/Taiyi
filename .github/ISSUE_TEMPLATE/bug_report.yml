name: 缺陷报告
description: 报告可以稳定复现的错误行为
title: "[缺陷]："
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供操作系统、Python 版本、模型提供器和太一版本，切勿包含密钥。
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: 可能受影响的不变量
      description: 例如来源追溯、隔离、审核门、不可变或删除语义。
