name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, provider, and Taiyi version. Never include secrets.
    validations:
      required: true
